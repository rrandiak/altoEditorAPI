application:
  batch:
    # Per-batch worker pool size (the parallel accept/retrieve fan-out uses workerThreads-1).
    workerThreads: "${ALTO_EDITOR_WORKER_THREADS:8}"
  store:
    path: "${ALTO_EDITOR_STORE_PATH:/tmp/altoEditorTestStore}"
    pattern: "xx/xx/xx"
    compression: "${ALTO_EDITOR_STORE_COMPRESSION:ZSTD}"
    compressionLevel: "${ALTO_EDITOR_STORE_COMPRESSION_LEVEL:3}"
  kramerius-instances:
    k7-mzk:
      title: "${ALTO_EDITOR_KRAMERIUS_TITLE:Kramerius 7 - MZK}"
      url: "${ALTO_EDITOR_KRAMERIUS_URL:https://api.kramerius.mzk.cz/}"
      serviceClientId: "${ALTO_EDITOR_SERVICE_CLIENT_ID:replaceMe}"
      serviceSecret: "${ALTO_EDITOR_SERVICE_SECRET:replaceMe}"
      maxConnections: "${ALTO_EDITOR_MAX_CONNECTIONS:32}"
  engines:
    pero-vut:
      exec: "python"
      entry: "/usr/local/bin/pero-vut/client.py"
      apiKey: "${ALTO_EDITOR_PERO_VUT_KEY:replaceMe}"
    pero-distributed:
      exec: "python"
      entry: "/usr/local/bin/pero-distributed/client.py"
      parallelism: 20
      additionalArgs:
        - "--redis-url"
        - "${ALTO_EDITOR_REDIS_URL:replaceMe}"
        - "--minio-url"
        - "${ALTO_EDITOR_MINIO_URL:replaceMe}"
        - "--minio-access-key"
        - "${ALTO_EDITOR_MINIO_ACCESS_KEY:replaceMe}"
        - "--minio-secret-key"
        - "${ALTO_EDITOR_MINIO_SECRET_KEY:replaceMe}"
        - "--engine"
        - "7"
    tuzka:
      type: "TUZKA"
      baseUrl: "${ALTO_EDITOR_TUZKA_URL:replaceMe}"
      apiKey: "${ALTO_EDITOR_TUZKA_KEY:replaceMe}"
      fmt: "alto"
      parallelism: 20

spring:
  datasource:
    driver-class-name: "${ALTO_EDITOR_JDBC_DRIVER:org.h2.Driver}"
    url: "${ALTO_EDITOR_JDBC_URL:jdbc:h2:mem:altoEditorTestDb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: "${ALTO_EDITOR_JDBC_USERNAME:altoEditor}"
    password: "${ALTO_EDITOR_JDBC_PASSWORD:replaceMe}"
    hikari:
      maximum-pool-size: "${ALTO_EDITOR_HIKARI_POOL_SIZE:30}"
  jpa:
    hibernate:
      ddl-auto: "${ALTO_EDITOR_DDL_AUTO:update}"
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        search:
          backend:
            directory:
              root: ${ALTO_EDITOR_INDEX_DIRECTORY:/tmp/hibernate-search-index}

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.hibernate.orm.jdbc.bind: off
    org.hibernate: warn

